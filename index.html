<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids&Us Planner</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Nunito', sans-serif; background-color: #FAFAF7; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        const CS = [
          {id:"mousy",name:"Mousy",color:"#8CB43B",bg:"#F0F7E1",em:"\u{1F42D}",age:"1 anno",parts:["Part One","Part Two","Part Three","Part Four"],dp:10},
          {id:"linda",name:"Linda",color:"#F26522",bg:"#FFF0E6",em:"\u{1F431}",age:"2 anni",parts:["Part One","Part Two","Part Three","Part Four"],dp:10},
          {id:"sam",name:"Sam",color:"#00B3B0",bg:"#E0F7F7",em:"\u{1F9F8}",age:"3 anni",parts:["Story 1","Story 2","Story 3","Story 4"],dp:10},
          {id:"emma",name:"Emma",color:"#E878A0",bg:"#FFF0F5",em:"\u{1F98B}",age:"4 anni",parts:["Story 1","Story 2","Story 3","Story 4"],dp:10},
          {id:"oliver",name:"Oliver",color:"#00B3B0",bg:"#E0F7F7",em:"\u{1F438}",age:"5 anni",parts:["Story 1","Story 2","Story 3","Story 4"],dp:10},
          {id:"marcia",name:"Marcia",color:"#E94E58",bg:"#FFEBEE",em:"\u{1F380}",age:"6 anni",parts:["Story 1","Story 2","Story 3","Story 4"],dp:10},
        ];

        function App() {
          const [view, setV] = useState("home");
          const [lessons, setL] = useState({});
          const [sc, setSc] = useState(null);
          const [sp, setSp] = useState(null);
          const [sd, setSd] = useState(null);
          const [scn, setScn] = useState(false);
          const [ss, setSs] = useState("");
          const fr = useRef(null);

          useEffect(() => { 
            const saved = localStorage.getItem("ku7");
            if (saved) setL(JSON.parse(saved));
          }, []);

          useEffect(() => { localStorage.setItem("ku7", JSON.stringify(lessons)); }, [lessons]);

          const scanD = async (files) => {
            if (!files || !files.length || !sc) return;
            setScn(true); setSs("Lettura immagini...");
            try {
              const imgs = [];
              for (const f of files) {
                const b = await new Promise((r) => {
                  const rd = new FileReader();
                  rd.onload = () => r(rd.result.split(",")[1]);
                  rd.readAsDataURL(f);
                });
                imgs.push({ type: "image", source: { type: "base64", media_type: f.type || "image/jpeg", data: b } });
              }
              setSs("Analisi Claude...");
              const res = await fetch("/api/generate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  model: "claude-3-5-sonnet-20240620",
                  max_tokens: 4000,
                  messages: [{ role: "user", content: [...imgs, { type: "text", text: "Extract lesson activities. Return ONLY JSON array: {name, duration, target_language, description}." }] }]
                })
              });
              const d = await res.json();
              const txt = d.content[0].text;
              const parsed = JSON.parse(txt.replace(/```json\n?|```/g, ""));
              setL(prev => ({ ...prev, [sc.id+"|"+sp+"|"+sd]: { activities: parsed.map((a,i)=>({...a, id: Date.now()+i})) } }));
              setSs("Completato!");
              setTimeout(() => setScn(false), 2000);
            } catch (e) {
              setSs("Errore: " + e.message);
              setTimeout(() => setScn(false), 4000);
            }
          };

          return (
            <div style={{minHeight:"100vh", padding:20}}>
              <h1 onClick={() => setV("home")} style={{cursor:"pointer"}}>Kids&Us Planner</h1>
              {view === "home" && CS.map(c => (
                <div key={c.id} onClick={()=>{setSc(c); setV("course")}} style={{padding:20, margin:"10px 0", background:"#fff", borderLeft:"5px solid "+c.color, borderRadius:10, boxShadow:"0 2px 5px #0001"}}>
                  {c.em} {c.name}
                </div>
              ))}
              {view === "course" && (
                <div>
                  <h2>{sc.name}</h2>
                  <div style={{display:"grid", gridTemplateColumns:"repeat(5, 1fr)", gap:10}}>
                    {[...Array(10)].map((_,i) => (
                      <div key={i} onClick={()=>{setSp("Part 1"); setSd(i+1); setV("lesson")}} style={{padding:15, background:"#fff", borderRadius:8, textAlign:"center", cursor:"pointer", border:"1px solid #ddd"}}>
                        {i+1}
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {view === "lesson" && (
                <div>
                  <h3>Day {sd}</h3>
                  <button onClick={() => fr.current.click()} style={{padding:15, background:"#F26522", color:"#fff", border:"none", borderRadius:10, fontWeight:"bold"}}>SCAN TG</button>
                  <input type="file" ref={fr} multiple style={{display:"none"} } onChange={(e) => scanD(e.target.files)} />
                  {scn && <p>{ss}</p>}
                  {lessons[sc.id+"|"+sp+"|"+sd]?.activities.map(a => (
                    <div key={a.id} style={{padding:10, background:"#fff", margin:"10px 0", borderRadius:8, borderLeft:"4px solid "+sc.color}}>
                      <b>{a.name}</b> ({a.duration}m)
                      <p>{a.target_language}</p>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
